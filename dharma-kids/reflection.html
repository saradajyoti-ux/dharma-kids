<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Guided Reflections</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #fff7ed, #ffe4e6);
      color: #7c2d12;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 15px;
      cursor: pointer;
      border: 2px solid #fde68a;
    }

    .card.active {
      border-color: orange;
    }

    .emoji {
      font-size: 30px;
    }

    .box {
      background: white;
      border-radius: 20px;
      padding: 20px;
    }

    .moods button {
      margin: 5px;
      padding: 10px;
      border-radius: 15px;
      border: none;
      cursor: pointer;
      background: #fef3c7;
    }

    textarea {
      width: 100%;
      height: 120px;
      margin-top: 10px;
      border-radius: 10px;
      padding: 10px;
    }

    button {
      margin-top: 10px;
      padding: 10px 15px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .primary {
      background: orange;
      color: white;
    }

    .secondary {
      background: #fde68a;
    }

    .journal {
      margin-top: 20px;
    }

    .entry {
      background: #fff7ed;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🌸 Guided Reflections</h1>

    <!-- Reflection choices -->
    <div class="cards" id="cards"></div>

    <!-- Main box -->
    <div class="box">
      <p id="intro"></p>

      <!-- Mood -->
      <div id="moodSection">
        <h3>How are you feeling?</h3>
        <div class="moods">
          <button onclick="setMood('😊 Happy')">😊 Happy</button>
          <button onclick="setMood('😌 Calm')">😌 Calm</button>
          <button onclick="setMood('🤔 Unsure')">🤔 Unsure</button>
          <button onclick="setMood('😢 Sad')">😢 Sad</button>
        </div>
      </div>

      <!-- Question -->
      <div id="questionSection" style="display:none;">
        <h3 id="question"></h3>
        <textarea id="answer"></textarea>

        <br />
        <button class="secondary" onclick="prev()">Back</button>
        <button class="primary" onclick="next()">Next</button>
      </div>
    </div>

    <!-- Journal -->
    <div class="journal">
      <h2>📘 Your Journal</h2>
      <div id="entries"></div>
    </div>
  </div>

  <script>
    const reflections = [
      {
        title: "Gratitude Garden",
        intro: "Think about the good things in your day 🌸",
        steps: [
          "What made you smile today?",
          "Who helped you today?",
          "What are you thankful for?"
        ]
      },
      {
        title: "Peaceful Breath",
        intro: "Let’s feel calm and peaceful 🕯️",
        steps: [
          "Take 3 breaths. How do you feel?",
          "What is on your mind?",
          "What can help you feel calm?"
        ]
      },
      {
        title: "Kindness Hero",
        intro: "Kindness makes the world brighter 💛",
        steps: [
          "What kind thing did you do?",
          "How did it feel?",
          "What will you do tomorrow?"
        ]
      }
    ];

    let selected = 0;
    let step = 0;
    let mood = "";
    let answers = [];

    function renderCards() {
      const cards = document.getElementById("cards");
      cards.innerHTML = "";

      reflections.forEach((r, i) => {
        const div = document.createElement("div");
        div.className = "card" + (i === selected ? " active" : "");
        div.innerHTML = `<div class="emoji">🌟</div><b>${r.title}</b>`;
        div.onclick = () => selectReflection(i);
        cards.appendChild(div);
      });
    }

    function selectReflection(i) {
      selected = i;
      step = 0;
      mood = "";
      answers = [];
      document.getElementById("questionSection").style.display = "none";
      document.getElementById("moodSection").style.display = "block";
      render();
    }

    function setMood(m) {
      mood = m;
      document.getElementById("moodSection").style.display = "none";
      document.getElementById("questionSection").style.display = "block";
      showQuestion();
    }

    function showQuestion() {
      document.getElementById("question").innerText =
        reflections[selected].steps[step];
      document.getElementById("answer").value = answers[step] || "";
    }

    function next() {
      answers[step] = document.getElementById("answer").value;

      if (step < reflections[selected].steps.length - 1) {
        step++;
        showQuestion();
      } else {
        saveEntry();
      }
    }

    function prev() {
      if (step > 0) {
        step--;
        showQuestion();
      }
    }

    function saveEntry() {
      const entry = {
        title: reflections[selected].title,
        mood,
        answers,
        date: new Date().toLocaleDateString()
      };

      const saved = JSON.parse(localStorage.getItem("reflections") || "[]");
      saved.unshift(entry);
      localStorage.setItem("reflections", JSON.stringify(saved));

      alert("Reflection saved 🌸");
      loadEntries();
      selectReflection(selected);
    }

    function loadEntries() {
      const container = document.getElementById("entries");
      const saved = JSON.parse(localStorage.getItem("reflections") || "[]");

      container.innerHTML = "";

      saved.forEach((e) => {
        const div = document.createElement("div");
        div.className = "entry";
        div.innerHTML = `
          <b>${e.title}</b><br/>
          ${e.date} · ${e.mood}
        `;
        container.appendChild(div);
      });
    }

    function render() {
      renderCards();
      document.getElementById("intro").innerText =
        reflections[selected].intro;
    }

    render();
    loadEntries();
  </script>
</body>
</html>
