<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daily Dharma Lesson</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #fff7ed;
  color: #292524;
}

.nav {
  padding: 12px 20px;
  background: white;
  border-bottom: 1px solid #fed7aa;
}

.nav a {
  text-decoration: none;
  color: #ea580c;
  font-weight: bold;
}

.container {
  max-width: 760px;
  margin: auto;
  padding: 24px;
}

.card {
  background: white;
  border-radius: 24px;
  padding: 22px;
  border: 1px solid #fed7aa;
  box-shadow: 0 8px 24px rgba(0,0,0,0.06);
}

.lesson-box {
  background: #fff7ed;
  border: 1px solid #fed7aa;
  border-radius: 18px;
  padding: 18px;
  min-height: 220px;
  white-space: pre-wrap;
  line-height: 1.55;
}

button {
  padding: 12px 16px;
  margin-top: 14px;
  border-radius: 999px;
  border: none;
  background: #ea580c;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.small {
  color: #78716c;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="nav">
  <a href="/">← Back to Home</a>
</div>

<div class="container">
  <div class="card">
    <h1>🌞 Today’s Dharma Lesson</h1>
    <p class="small">A fresh child-friendly lesson each day.</p>

    <div id="lesson" class="lesson-box">
      Loading today’s lesson...
    </div>

    <button onclick="getLesson()">Refresh Lesson</button>
  </div>
</div>

<script>
async function getLesson() {
  const lessonBox = document.getElementById("lesson");
  lessonBox.innerText = "Loading today’s lesson...";

  try {
    const res = await fetch("/api/daily-lesson");
    const data = await res.json();

    lessonBox.innerText = data.lesson || "Sorry, I could not create today’s lesson right now.";
  } catch (err) {
    lessonBox.innerText = "Sorry, I could not create today’s lesson right now.";
  }
}

getLesson();
</script>

</body>
</html>
