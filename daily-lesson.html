<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daily Dharma Lesson</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #fff7ed;
}

.nav {
  padding: 12px 20px;
  background: white;
  border-bottom: 1px solid #fed7aa;
}

.nav a {
  text-decoration: none;
  color: #ea580c;
  font-weight: bold;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 20px;
  border: 1px solid #fed7aa;
}

button {
  padding: 10px;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
  background: #ea580c;
  color: white;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="nav">
  <a href="/">← Back to Home</a>
</div>

<div class="container">
  <div class="card">
    <h2>🌞 Today’s Dharma Lesson</h2>

    <div id="lesson">Click below to get today’s lesson</div>

    <button onclick="getLesson()">Get Lesson</button>
  </div>
</div>

<script>
async function getLesson() {
  const res = await fetch("/api/ramakrishna-chat", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      question: "Give me a short daily lesson for a child from Sri Ramakrishna, with a teaching, explanation, and reflection question.",
      mode: "simple"
    })
  });

  const data = await res.json();

  document.getElementById("lesson").innerText = data.answer;
}
</script>

</body>
</html>
