<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sri Ramakrishna | Dharma Kids</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  padding: 20px;
  background: #fff7ed;
}

button {
  padding: 10px;
  margin: 5px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
}

.active {
  background: orange;
  color: white;
}
</style>
</head>

<body>

<h2>Sri Ramakrishna Guide</h2>

<div>
  <button id="simple" onclick="setMode('simple')" class="active">Explain Simply</button>
  <button id="story" onclick="setMode('story')">Story</button>
  <button id="quiz" onclick="setMode('quiz')">Quiz</button>
</div>

<br>

<div id="chat"></div>

<br>

<input id="question" placeholder="Ask something..." />
<button onclick="ask()">Ask</button>

<script>
let mode = "simple";

function setMode(m) {
  mode = m;

  document.getElementById("simple").classList.remove("active");
  document.getElementById("story").classList.remove("active");
  document.getElementById("quiz").classList.remove("active");

  document.getElementById(m).classList.add("active");
}

function add(text) {
  const div = document.createElement("div");
  div.innerText = text;
  document.getElementById("chat").appendChild(div);
}

async function ask() {
  const q = document.getElementById("question").value;

  add("You: " + q);

  const res = await fetch("/api/ramakrishna-chat", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      question: q,
      mode: mode
    })
  });

  const data = await res.json();

  add("Guide: " + data.answer);
}
</script>

</body>
</html>
